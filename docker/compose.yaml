# docker compose -f docker/compose.yaml up
x-sift: &sift
  build:
    context: ..
    dockerfile: docker/Dockerfile
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: [/tmp]
  volumes:
    # Database and OAuth tokens. Must be writable: refresh tokens rotate.
    - sift-data:/data

services:
  # Syncs and triages. Observes only; add "--act" to the command to let it change Gmail.
  sift:
    <<: *sift
    command: [run]

  # Read-only web page over the same database, published on this machine only.
  dashboard:
    <<: *sift
    command: [dashboard, --host, 0.0.0.0]
    ports:
      - 127.0.0.1:8787:8787

volumes:
  sift-data:
