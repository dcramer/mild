name: CI

# Every branch, so a commit has passed before it reaches main, which requires it (the repository's ruleset).
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # A pull request from a branch here was already checked when the branch was pushed; one from a fork was not.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # pnpm version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - id: install
        run: pnpm install --frozen-lockfile

      # Each check runs even if an earlier one failed, so one run reports every problem.
      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm typecheck

      - name: Lint (errors fail, warnings annotate)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm oxlint --format=github

      - name: Unused code
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm knip

      - name: Format
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm format:check

      - name: Test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm test

      - name: Build dashboard
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm build:web

      - name: Browser tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm exec playwright install --with-deps chromium && pnpm e2e

      - uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
